<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#251a52"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
  </defs>

  <!-- Background (square — iOS adds rounded corners itself) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Outer wave -->
  <path d="M 76 348 A 180 180 0 0 1 436 348"
        fill="none" stroke="#7c6ff7" stroke-width="30"
        stroke-linecap="round" opacity="0.35"/>

  <!-- Middle wave -->
  <path d="M 136 348 A 120 120 0 0 1 376 348"
        fill="none" stroke="#7c6ff7" stroke-width="34"
        stroke-linecap="round" opacity="0.65"/>

  <!-- Inner wave -->
  <path d="M 196 348 A 60 60 0 0 1 316 348"
        fill="none" stroke="#a89fff" stroke-width="38"
        stroke-linecap="round" opacity="0.9"/>

  <!-- Center dot -->
  <circle cx="256" cy="348" r="26" fill="#7c6ff7"/>
  <circle cx="256" cy="348" r="13" fill="#d0cbff"/>
</svg>
