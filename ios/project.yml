name: FMRadio
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  FMRadio:
    type: application
    platform: iOS
    sources: [FMRadio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fmradio
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FMRadio/Info.plist
      properties:
        CFBundleDisplayName: FM Radio
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
